name: Bangun APK GrowBin

on:
  push:
  workflow_dispatch:

env:
  # Alamat situs Netlify GrowBin. Sudah terisi, tidak perlu diubah.
  SITUS: "https://glistening-moonbeam-0ef90e.netlify.app"

jobs:
  apk:
    name: Bangun APK
    runs-on: ubuntu-latest

    steps:
      - name: Tulis proyek Android
        run: |
          mkdir -p app/src/main/java/id/growbin/app app/src/main/res/values app/src/main/res/mipmap-anydpi-v26 app/src/main/assets/icons
          cat > settings.gradle <<'BERKAS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins { id 'com.android.application' version '8.5.2' }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GrowBin"
          include ':app'
          BERKAS
          cat > gradle.properties <<'BERKAS'
          org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          BERKAS
          cat > app/build.gradle <<'BERKAS'
          plugins { id 'com.android.application' }
          android {
              namespace 'id.growbin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "id.growbin.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  rilis {
                      storeFile file("../growbin.keystore")
                      storePassword "growbin123"
                      keyAlias "growbin"
                      keyPassword "growbin123"
                  }
              }
              buildTypes {
                  release { minifyEnabled false; signingConfig signingConfigs.rilis }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          BERKAS
          cat > app/src/main/AndroidManifest.xml <<'BERKAS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="portrait" android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          BERKAS
          cat > app/src/main/res/values/nilai.xml <<'BERKAS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">GrowBin</string>
              <color name="brand">#006838</color>
              <color name="bg">#F9F7F0</color>
              <color name="ic_bg">#FFFFFF</color>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          BERKAS
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'BERKAS'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          BERKAS
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'BERKAS'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          BERKAS
          cat > app/src/main/java/id/growbin/app/MainActivity.java <<'BERKAS'
          package id.growbin.app;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;
          
          /** GrowBin - aplikasi toko, tugas Simulasi Digital Marketing UNPAM.
           *  Seluruh berkas aplikasi ikut dikemas di dalam APK (folder assets) dan
           *  disajikan lewat alamat maya https://rumpun.local/ supaya penyimpanan
           *  peramban berfungsi. Akibatnya aplikasi tetap jalan tanpa sinyal. */
          public class MainActivity extends Activity {
          
              private static final String HOST = "growbin.local";
              private WebView web;
          
              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  web = new WebView(this);
                  setContentView(web, new ViewGroup.LayoutParams(-1, -1));
          
                  WebSettings set = web.getSettings();
                  set.setJavaScriptEnabled(true);
                  set.setDomStorageEnabled(true);
                  set.setUseWideViewPort(true);
                  set.setLoadWithOverviewMode(true);
                  set.setSupportZoom(false);
                  set.setBuiltInZoomControls(false);
          
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return sajikan(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (u == null || HOST.equals(u.getHost())) return false;
                          try {
                              Intent i = new Intent(Intent.ACTION_VIEW, u);
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } catch (Exception abaikan) { }
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) { tema(); }
                  });
          
                  if (s != null) web.restoreState(s);
                  else web.loadUrl("https://" + HOST + "/index.html");
              }
          
              private WebResourceResponse sajikan(Uri a) {
                  if (a == null || !HOST.equals(a.getHost())) return null;
                  String p = a.getPath();
                  if (p == null || p.isEmpty() || "/".equals(p)) p = "/index.html";
                  String berkas = p.startsWith("/") ? p.substring(1) : p;
                  try {
                      InputStream in = getAssets().open(berkas);
                      WebResourceResponse res = new WebResourceResponse(jenis(berkas), "utf-8", in);
                      Map<String, String> h = new HashMap<String, String>();
                      h.put("Access-Control-Allow-Origin", "*");
                      res.setResponseHeaders(h);
                      return res;
                  } catch (IOException tidakAda) {
                      return null;
                  }
              }
          
              private String jenis(String b) {
                  if (b.endsWith(".html")) return "text/html";
                  if (b.endsWith(".js")) return "application/javascript";
                  if (b.endsWith(".css")) return "text/css";
                  if (b.endsWith(".png")) return "image/png";
                  if (b.endsWith(".svg")) return "image/svg+xml";
                  if (b.endsWith(".webmanifest") || b.endsWith(".json")) return "application/json";
                  return "application/octet-stream";
              }
          
              /** Teruskan mode gelap perangkat ke halaman, yang sudah punya dua tema. */
              private void tema() {
                  if (web == null) return;
                  int m = getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  String t = (m == Configuration.UI_MODE_NIGHT_YES) ? "dark" : "light";
                  try {
                      web.evaluateJavascript("document.documentElement.setAttribute('data-theme','" + t + "');", null);
                  } catch (Throwable abaikan) { }
              }
          
              @Override
              public void onConfigurationChanged(Configuration c) { super.onConfigurationChanged(c); tema(); }
          
              @Override
              public boolean onKeyDown(int k, KeyEvent e) {
                  if (k == KeyEvent.KEYCODE_BACK && web != null && web.canGoBack()) { web.goBack(); return true; }
                  return super.onKeyDown(k, e);
              }
          
              @Override
              protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); if (web != null) web.saveState(o); }
          }
          BERKAS
          echo "--- proyek tertulis ---"
          find . -type f | sort

      - name: Ambil aplikasi dan ikon dari situsmu
        run: |
          B="${SITUS%/}"
          OK=""
          for C in "$B" "$B/pwa"; do
            echo "Mencoba $C/index.html"
            if curl -fsSL --max-time 120 "$C/index.html" -o app/src/main/assets/index.html; then
              OK="$C"; echo "Berhasil dari $C"; break
            fi
          done
          if [ -z "$OK" ]; then
            echo "::error::Tidak bisa mengambil index.html dari $B. Pastikan situs Netlify-mu Public dan sudah berisi versi GrowBin yang baru."
            exit 1
          fi
          BYTE=$(wc -c < app/src/main/assets/index.html)
          echo "index.html = $BYTE byte"
          if [ "$BYTE" -lt 300000 ]; then
            echo "::error::index.html hanya $BYTE byte. Versi GrowBin dengan foto berukuran sekitar 800 KB - kemungkinan situs Netlify belum diperbarui dengan zip yang baru."
            exit 1
          fi
          curl -fsSL --max-time 60 "$OK/manifest.webmanifest" -o app/src/main/assets/manifest.webmanifest || true
          curl -fsSL --max-time 60 "$OK/sw.js" -o app/src/main/assets/sw.js || true

          echo "--- ikon peluncur ---"
          for D in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $D
            mkdir -p "app/src/main/res/mipmap-$1"
            curl -fsSL --max-time 60 "$OK/icons/ic-$2.png"  -o "app/src/main/res/mipmap-$1/ic_launcher.png"
            curl -fsSL --max-time 60 "$OK/icons/fg-$3.png"  -o "app/src/main/res/mipmap-$1/ic_launcher_foreground.png"
            echo "  mipmap-$1 siap"
          done
          ls -la app/src/main/res/mipmap-xxxhdpi

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        run: |
          # Mesin GitHub sudah membawa Android SDK. Aksi android-actions/setup-android
          # mencoba memasang paket lawas bernama "tools" yang sudah dihapus Google,
          # dan itulah yang menggagalkan build sebelumnya.
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-tidak ditemukan}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "--- platform yang tersedia ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(kosong; Gradle akan mengunduhnya sendiri)"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buat kunci penandatangan
        run: |
          keytool -genkeypair -v -keystore growbin.keystore -storetype PKCS12 \
            -alias growbin -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass growbin123 -keypass growbin123 \
            -dname "CN=GrowBin, O=Tugas Kuliah, L=Tangerang Selatan, ST=Banten, C=ID"

      - name: Bangun APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Kumpulkan hasil
        if: always()
        run: |
          mkdir -p keluaran
          cp app/build/outputs/apk/release/app-release.apk keluaran/GrowBin.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk keluaran/GrowBin-uji-coba.apk || true
          cp growbin.keystore keluaran/ || true
          ls -la keluaran

      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowBin-APK
          path: keluaran/
          if-no-files-found: warn
          retention-days: 30
